# Blueprint Render: satu service yang melayani API + frontend. Database = MongoDB Atlas.
# Isi MONGODB_URI di dashboard Render (sync: false = tidak disimpan di repo).
services:
  - type: web
    name: pantau
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DB_NAME
        value: pantau_db
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
